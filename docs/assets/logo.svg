<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow circle -->
  <circle cx="100" cy="100" r="85" fill="url(#glowGradient)" opacity="0.4"/>
  
  <!-- Main lens circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#lensGradient)" stroke-width="6"/>
  
  <!-- Inner lens reflection -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="url(#lensGradient)" stroke-width="3" opacity="0.5"/>
  
  <!-- Focus crosshair -->
  <line x1="100" y1="45" x2="100" y2="65" stroke="url(#lensGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="135" x2="100" y2="155" stroke="url(#lensGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="45" y1="100" x2="65" y2="100" stroke="url(#lensGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="100" x2="155" y2="100" stroke="url(#lensGradient)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Human silhouettes representing workforce -->
  <g opacity="0.7">
    <!-- Person 1 - staying -->
    <circle cx="85" cy="90" r="6" fill="#10B981"/>
    <path d="M 85 96 L 85 110 M 78 103 L 92 103" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Person 2 - risk -->
    <circle cx="115" cy="90" r="6" fill="#F59E0B"/>
    <path d="M 115 96 L 115 110 M 108 103 L 122 103" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Person 3 - leaving -->
    <circle cx="100" cy="110" r="6" fill="#EF4444"/>
    <path d="M 100 116 L 100 130 M 93 123 L 107 123" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Lens handle -->
  <rect x="150" y="145" width="35" height="8" rx="4" fill="url(#lensGradient)" transform="rotate(45 150 150)"/>
  
  <!-- Subtle data points -->
  <circle cx="70" cy="70" r="2" fill="#3B82F6" opacity="0.6"/>
  <circle cx="130" cy="70" r="2" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="70" cy="130" r="2" fill="#3B82F6" opacity="0.6"/>
  <circle cx="130" cy="130" r="2" fill="#8B5CF6" opacity="0.6"/>
</svg>
