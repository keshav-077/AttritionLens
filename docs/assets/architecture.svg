<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1F2937">
    AttritionLens Architecture
  </text>
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#6B7280">
    End-to-End ML Pipeline for Workforce Retention Intelligence
  </text>
  
  <!-- Stage 1: Raw Data -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="180" height="380" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="50" y="120" width="180" height="45" rx="8" fill="url(#dataGrad)"/>
    <text x="140" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      📊 Raw Data
    </text>
    
    <!-- Data source -->
    <rect x="70" y="185" width="140" height="60" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="140" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1E40AF">
      HR Dataset (CSV)
    </text>
    <text x="140" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">
      14,999 employees
    </text>
    
    <!-- Cleaning -->
    <rect x="70" y="265" width="140" height="70" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
    <text x="140" y="288" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#065F46">
      Data Cleaning
    </text>
    <text x="140" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • Remove duplicates
    </text>
    <text x="140" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • Rename columns
    </text>
    
    <!-- Feature Eng -->
    <rect x="70" y="355" width="140" height="130" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="140" y="378" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#92400E">
      Feature Engineering
    </text>
    <text x="140" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • Drop satisfaction_level
    </text>
    <text x="140" y="410" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      (data leakage)
    </text>
    <text x="140" y="428" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • Create overworked
    </text>
    <text x="140" y="443" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      feature (hours > 175)
    </text>
    <text x="140" y="461" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • Encode categoricals
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 230 300 L 280 300" stroke="#6B7280" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>
  
  <!-- Stage 2: ML Pipeline -->
  <g filter="url(#shadow)">
    <rect x="280" y="120" width="220" height="380" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="280" y="120" width="220" height="45" rx="8" fill="url(#mlGrad)"/>
    <text x="390" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      🤖 ML Pipeline
    </text>
    
    <!-- Preprocessor -->
    <rect x="300" y="185" width="180" height="75" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="390" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#5B21B6">
      ColumnTransformer
    </text>
    <text x="390" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • OrdinalEncoder (salary)
    </text>
    <text x="390" y="240" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      • OneHotEncoder (dept)
    </text>
    
    <!-- Model Training -->
    <rect x="300" y="280" width="180" height="100" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="390" y="303" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E40AF">
      RandomForestClassifier
    </text>
    <text x="390" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      GridSearchCV Tuning:
    </text>
    <text x="390" y="335" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      max_depth, n_estimators,
    </text>
    <text x="390" y="348" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      min_samples_split,
    </text>
    <text x="390" y="361" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      min_samples_leaf
    </text>
    
    <!-- Best Model -->
    <rect x="300" y="400" width="180" height="85" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="390" y="420" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#065F46">
      Best Model
    </text>
    <text x="390" y="438" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#059669">
      AUC: 93.8% | Acc: 96.2%
    </text>
    <text x="390" y="453" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      Precision: 87% | Recall: 90%
    </text>
    <text x="390" y="468" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6B7280">
      F1-Score: 88.67%
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 500 300 L 550 300" stroke="#6B7280" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: Serialization -->
  <g filter="url(#shadow)">
    <rect x="550" y="240" width="150" height="120" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="550" y="240" width="150" height="40" rx="8" fill="#FCD34D"/>
    <text x="625" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#78350F">
      💾 Persistence
    </text>
    
    <rect x="570" y="295" width="110" height="50" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="625" y="315" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#92400E">
      rf2_pipeline.pkl
    </text>
    <text x="625" y="332" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      joblib serialization
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 700 300 L 750 300" stroke="#6B7280" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: Streamlit App -->
  <g filter="url(#shadow)">
    <rect x="750" y="120" width="200" height="380" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="750" y="120" width="200" height="45" rx="8" fill="url(#appGrad)"/>
    <text x="850" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      🌐 Web App
    </text>
    
    <!-- Prediction Form -->
    <rect x="770" y="185" width="160" height="85" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="850" y="206" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#065F46">
      Prediction Form
    </text>
    <text x="850" y="223" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Performance score
    </text>
    <text x="850" y="237" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Projects count
    </text>
    <text x="850" y="251" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Tenure, dept, salary
    </text>
    
    <!-- EDA Dashboard -->
    <rect x="770" y="290" width="160" height="95" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="850" y="311" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E40AF">
      EDA Dashboard
    </text>
    <text x="850" y="328" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Dept attrition charts
    </text>
    <text x="850" y="342" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Satisfaction trends
    </text>
    <text x="850" y="356" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Promotion impact
    </text>
    <text x="850" y="370" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      • Correlation heatmap
    </text>
    
    <!-- Risk Scoring -->
    <rect x="770" y="405" width="160" height="80" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="850" y="426" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#991B1B">
      Risk Scoring
    </text>
    <text x="850" y="443" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      🔴 High Risk (p ≥ 0.7)
    </text>
    <text x="850" y="457" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      🟡 Medium Risk (0.3-0.7)
    </text>
    <text x="850" y="471" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6B7280">
      🟢 Low Risk (p < 0.3)
    </text>
  </g>
  
  <!-- Bottom tech stack -->
  <rect x="50" y="530" width="900" height="50" rx="8" fill="#F3F4F6"/>
  <text x="500" y="552" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#374151">
    Tech Stack:
  </text>
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6B7280">
    Python • pandas • scikit-learn • Streamlit • Plotly • joblib
  </text>
</svg>
